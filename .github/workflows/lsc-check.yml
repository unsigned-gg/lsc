          version = "2.0.1"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "f8fadd59c855ef2080decdef8ff161eb6661b86933c9d82e5ba29dc602a55aba"

          [[package]]
          name = "syn"
          version = "3.0.9"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "d78c8dee4c7bf0e14673097256fed6142ce9d3b85a408189d07482442145823b"
          dependencies = [
           "proc-macro2",
           "quote",
           "unicode-ident",
          ]

          [[package]]
          name = "unicode-ident"
          version = "1.0.27"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "a2c754d6c33795a1c324727428e5a7dedb5b06195f9890bdbcba760d3e246563"

          [[package]]
          name = "unsafe-libyaml"
          version = "0.2.11"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "673aac59facbab8a9007c7f6108d11f63b603f7cabff99fabf650fea5c32b861"

          [[package]]
          name = "xtask"
          version = "0.1.0"
          dependencies = [
           "anyhow",
           "lsc-core",
           "serde_json",
          ]

          [[package]]
          name = "zmij"
          version = "1.0.23"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "29666d0abbfad1e3dc4dcf6144730dd3a3ab225bbbdac83319345b1b44ccfc1b"
          LOCK
          echo "$LSC_LOCK_SHA256  $src/Cargo.lock" | sha256sum -c -
          # Build from inside the checkout: rustup reads rust-toolchain.toml from the working
          # directory, not from --manifest-path, so this is what selects lsc's pinned 1.85.0.
          cd "$src"
          rustc --version
          cargo build --release --locked -p lsc -j 2
          echo "$LSC_LOCK_SHA256  $src/Cargo.lock" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lsc-bin"
          install -m 0755 "$src/target/release/lsc" "$RUNNER_TEMP/lsc-bin/lsc"

      - name: lsc check
        id: lsc-check
        env:
          SPECS_DIR: ${{ inputs.specs-dir }}
          LSC_MODE: ${{ inputs.lsc-mode }}
        run: |
          set -uo pipefail
          mode="${LSC_MODE:-warn}"
          case "$mode" in
            warn|error) ;;
            *) echo "::error::lsc-mode must be warn or error, got '$mode'"; exit 2 ;;
          esac
          specs_dir="${SPECS_DIR:-specs}"
          specs_dir="${specs_dir%/}"
          test -d "$specs_dir" || { echo "::error::specs-dir '$specs_dir' is not a directory in this checkout; lsc would pass it as empty"; exit 1; }
          "$RUNNER_TEMP/lsc-bin/lsc" --version
          rc=0
          out=$("$RUNNER_TEMP/lsc-bin/lsc" check "$specs_dir" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$mode" = "error" ]; then
            exit "$rc"
          fi
          # Workflow-command escaping: data escapes % CR LF; properties also escape : and ,.
          esc_data() { local s=$1; s=${s//'%'/'%25'}; s=${s//$'\r'/'%0D'}; s=${s//$'\n'/'%0A'}; printf '%s' "$s"; }
          esc_prop() { local s; s=$(esc_data "$1"); s=${s//':'/'%3A'}; s=${s//','/'%2C'}; printf '%s' "$s"; }
          summary_re='^ls: [0-9]+ error\(s\), [0-9]+ warning\(s\)$'
          located_re='^ls: (error|warning): ([^:]+):([0-9]+): (.*)$'
          plain_re='^ls: (error|warning): (.*)$'
          summary=""
          while IFS= read -r line; do
            if [[ "$line" =~ $summary_re ]]; then
              summary=${line#ls: }
            elif [[ "$line" =~ $located_re ]]; then
              path=${BASH_REMATCH[2]}
              while [[ "$path" == *//* ]]; do path=${path//\/\//\/}; done
              [[ "$path" == "$specs_dir"/* ]] || path="$specs_dir/$path"
              echo "::warning file=$(esc_prop "$path"),line=${BASH_REMATCH[3]}::$(esc_data "lsc ${BASH_REMATCH[1]}: ${BASH_REMATCH[4]}")"
            elif [[ "$line" =~ $plain_re ]]; then
              echo "::warning::$(esc_data "lsc ${BASH_REMATCH[1]}: ${BASH_REMATCH[2]}")"
            fi
          done <<<"$out"
          # Warn mode downgrades findings only. A run with no lsc summary did not complete a check.
          if [ -z "$summary" ]; then
            echo "::error::lsc check produced no result summary (exit $rc); warn mode does not hide a failed run"
            [ "$rc" -ne 0 ] || rc=1
            exit "$rc"
          fi
          echo "lsc-mode=warn: $summary (findings annotated as warnings; lsc exit $rc)"
