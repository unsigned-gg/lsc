# Reusable LeanSpec check (CER-2899, standard CER-2890): `lsc check` plus a spec-link check.
#
# Self-contained on purpose. A called workflow cannot locate files beside itself: its `github`
# context is the caller's. So the vendored lsc lockfile and the spec-link script live in this
# file, and a caller's one `@<sha>` pin covers the job, the lockfile and the script together.
#
# Caller:
#   lsc:
#     uses: unsigned-gg/lsc/.github/workflows/lsc-check.yml@<full-sha>
#     with: { runs-on: '{"group":"ent-default","labels":["ci-rust"]}' }

name: lsc check (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner as a JSON value for fromJSON, e.g. {"group":"ent-default","labels":["ci-rust"]}'
        required: true
        type: string
      specs-dir:
        description: Spec directory relative to the repository root
        required: false
        type: string
        default: specs
      lsc-rev:
        description: lsc commit to build; must equal the pin the embedded lockfile was generated for
        required: false
        type: string
        default: d19f393f7f9a65373d4a50f0734d9a927038c431
      spec-link-mode:
        description: warn (annotate, pass) or error (fail) for feat/fix PRs that touch and name no spec
        required: false
        type: string
        default: warn
      lsc-mode:
        description: warn (annotate findings, pass) or error (fail on findings); start with warn, switch to error after the backfill
        required: false
        type: string
        default: warn

permissions:
  contents: read

jobs:
  lsc:
    name: lsc check
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    env:
      LSC_PIN: d19f393f7f9a65373d4a50f0734d9a927038c431
      LSC_LOCK_SHA256: 484cf356af31ec6365fa9a13605514607a9eb8afac1f5d4fa202e2b1358fe463
    steps:
      - name: Check lsc-rev against the vendored lockfile pin
        env:
          LSC_REV: ${{ inputs.lsc-rev }}
        run: |
          if [ "$LSC_REV" != "$LSC_PIN" ]; then
            echo "::error::lsc-rev $LSC_REV has no vendored lockfile. This workflow carries the lockfile for $LSC_PIN only, and it never resolves dependencies afresh. Use the default, or update the pin and the lockfile together."
            exit 1
          fi

      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: List the pull request's changed files
        if: github.event_name == 'pull_request'
        run: git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-files.txt"

      # Title and body arrive through env, never through ${{ }} inside the script: PR text is untrusted.
      - name: Spec-link check
        id: spec-link
        if: github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SPECS_DIR: ${{ inputs.specs-dir }}
          SPEC_LINK_MODE: ${{ inputs.spec-link-mode }}
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          set -euo pipefail
          mode="${SPEC_LINK_MODE:-warn}"
          case "$mode" in
            warn|error) ;;
            *) echo "::error::spec-link-mode must be warn or error, got '$mode'"; exit 2 ;;
          esac
          if [ "${EVENT_NAME:-}" != "pull_request" ]; then
            echo "spec-link: not a pull_request event, skipped"
            exit 0
          fi
          title="${PR_TITLE:-}"
          title_re='^(feat|fix)(\([^)]*\))?!?: '
          if ! [[ "$title" =~ $title_re ]]; then
            echo "spec-link: title is not feat or fix, skipped"
            exit 0
          fi
          specs_dir="${SPECS_DIR:-specs}"
          specs_dir="${specs_dir%/}"
          while IFS= read -r path; do
            case "$path" in
              "$specs_dir"/*) echo "spec-link: touches $path"; exit 0 ;;
            esac
          done < "${CHANGED_FILES:-/dev/null}"
          body="${PR_BODY:-}"
          dir_re=$(printf '%s' "$specs_dir" | sed 's/[][\.*^$+?(){}|/]/\\&/g')
          if grep -qE "(^|[^[:alnum:]_./-])${dir_re}/[^[:space:]]+" <<<"$body" \
            || grep -qE '(^|[^[:alnum:]])SPEC-[0-9]{4}([^0-9]|$)' <<<"$body" \
            || grep -qE '(^|[^[:alnum:]])[0-9]{4}-[a-z][a-z0-9-]*' <<<"$body"; then
            echo "spec-link: body names a spec"
            exit 0
          fi
          msg="feat/fix PR touches no file under $specs_dir/ and names no spec (a $specs_dir/ path, SPEC-NNNN or NNNN-slug)"
          if [ "$mode" = "error" ]; then
            echo "::error::spec-link: $msg"
            exit 1
          fi
          echo "::warning::spec-link: $msg"

      - name: Restore cached lsc
        id: lsc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lsc-bin
          key: lsc-${{ runner.os }}-${{ runner.arch }}-d19f393f7f9a65373d4a50f0734d9a927038c431-484cf356af31ec6365fa9a13605514607a9eb8afac1f5d4fa202e2b1358fe463

      - name: Install Rust 1.85.0 (lsc rust-toolchain.toml)
        if: steps.lsc-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-linux-musl

      - name: Build lsc with the vendored lockfile
        if: steps.lsc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/lsc-src"
          git clone --filter=blob:none https://github.com/unsigned-gg/lsc.git "$src"
          git -C "$src" checkout --detach "$LSC_PIN"
          test "$(git -C "$src" rev-parse HEAD)" = "$LSC_PIN"
          # Generated at the pin by `cargo build --release -p lsc -j 2` on 2026-10-18 (CER-2899);
          # lsc gitignores Cargo.lock.
          cat > "$src/Cargo.lock" <<'LOCK'
          # This file is automatically @generated by Cargo.
          # It is not intended for manual editing.
          version = 4

          [[package]]
          name = "anyhow"
          version = "1.0.104"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "330a5ed07fa54e4702c9d6c4174f74427fc0ef6e214bbd677ae50a5099946470"

          [[package]]
          name = "arrayvec"
          version = "0.7.8"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "d3fb67a6e08acf24fdeccbac2cb6ac4305825bd1f117462e0e6f2f193345ad56"

          [[package]]
          name = "blake3"
          version = "1.8.7"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "6d9e454fc11f76977dc803893aff6304ed33d6a26efae8696573bea74baa27ae"
          dependencies = [
           "arrayvec",
           "cc",
           "cfg-if",
           "constant_time_eq",
           "cpufeatures",
          ]

          [[package]]
          name = "cc"
          version = "1.8.0"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "6651c9ed80effdc7db0ff72512157f901af5e3549e341e24b1dd4887d836d838"
          dependencies = [
           "find-msvc-tools",
           "shlex",
          ]

          [[package]]
          name = "cfg-if"
          version = "1.0.5"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "4e7648175b45a9a48536d676f68d918270699102aa8dab5496df06904c914600"

          [[package]]
          name = "constant_time_eq"
          version = "0.4.2"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "3d52eff69cd5e647efe296129160853a42795992097e8af39800e1060caeea9b"

          [[package]]
          name = "cpufeatures"
          version = "0.3.1"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "5ca28b0ae3115b884660db4118d803791fd6756b6e88f39c0f3f7859060d7566"
          dependencies = [
           "libc",
          ]

          [[package]]
          name = "equivalent"
          version = "1.0.3"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "00d174d5400e5e8fd687ad1049e2f578285fa914201b1af7e8b112a4546bd826"

          [[package]]
          name = "find-msvc-tools"
          version = "0.1.14"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "aedcfb3409746eddb02b9e19ebda1c3394f759a152e48ee875a0844d1b955484"

          [[package]]
          name = "hashbrown"
          version = "0.17.1"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "ed5909b6e89a2db4456e54cd5f673791d7eca6732202bbf2a9cc504fe2f9b84a"

          [[package]]
          name = "indexmap"
          version = "2.14.2"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "cc4e190f5d26ca7051642629da2c52fc03bde85a03197c99408dcd291734c855"
          dependencies = [
           "equivalent",
           "hashbrown",
          ]

          [[package]]
          name = "itoa"
          version = "1.0.18"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "8f42a60cbdf9a97f5d2305f08a87dc4e09308d1276d28c869c684d7777685682"

          [[package]]
          name = "libc"
          version = "0.2.191"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "65cd87c9a6d60536580b316ad985726104730a5151c99845f2490428ef91240a"

          [[package]]
          name = "lsc"
          version = "0.1.0"
          dependencies = [
           "lsc-core",
           "serde_json",
           "serde_yaml",
          ]

          [[package]]
          name = "lsc-core"
          version = "0.1.0"
          dependencies = [
           "blake3",
           "serde",
           "serde_json",
           "serde_yaml",
          ]

          [[package]]
          name = "memchr"
          version = "2.8.3"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "cf8baf1c55e62ffcace7a9f06f4bd9cd3f0c4beb022d3b367256b91b87513d98"

          [[package]]
          name = "proc-macro2"
          version = "1.0.107"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "985e7ec9bb745e6ce6535b544d84d6cd6f7ad8bd711c398938ae983b91a766d9"
          dependencies = [
           "unicode-ident",
          ]

          [[package]]
          name = "quote"
          version = "1.0.47"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "1fbf4db142a473a8d80c26bbf18454ed458bf8d26c8219c331daecfdbd079001"
          dependencies = [
           "proc-macro2",
          ]

          [[package]]
          name = "ryu"
          version = "1.0.23"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "9774ba4a74de5f7b1c1451ed6cd5285a32eddb5cccb8cc655a4e50009e06477f"

          [[package]]
          name = "serde"
          version = "1.0.229"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "4148590afebada386688f18773da617792bf2ef03ffc1e4cbd2b1d45b023e0ba"
          dependencies = [
           "serde_core",
           "serde_derive",
          ]

          [[package]]
